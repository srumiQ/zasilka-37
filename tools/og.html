<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Náhledový obrázek (1200 × 630)</title>
<!--
  Předloha náhledového obrázku pro sdílení odkazu (og.jpg).
  Styly i kresby si bere přímo z ../index.html, takže vypadá stejně jako přání.
  Postup vygenerování je v README (oddíl „Náhled při sdílení“).
-->
<style id="ogStyle">
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #110a06; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: var(--ink); font-family: var(--f-display);
    background:
      radial-gradient(120% 80% at 50% 114%, rgba(242,150,50,.44), rgba(242,150,50,0) 62%),
      radial-gradient(90% 50% at 50% -12%, rgba(120,62,22,.3), transparent 70%),
      linear-gradient(180deg, #130b06 0%, #1a1009 55%, #22140a 100%); }
  .og .kicker { font-size: 18px; letter-spacing: .26em; }
  .og .customs { width: 452px; flex: none; }
  .og .stamp b { font-size: 40px; }
  .og .stamp span { font-size: 17px; }
  .og .stamp small { font-size: 11px; }
  .og h1 { margin: 0; max-width: 640px; font: 800 52px/1.08 var(--f-display); letter-spacing: -.012em; text-align: center; text-wrap: balance; }
  .og .sub { margin: 0; font: 400 20px/1.3 var(--f-mono); letter-spacing: .02em; color: var(--muted); }
  /* žádný pohyb: obrázek se fotí v klidu */
  .og *, .og *::before, .og *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<div class="og" id="og"></div>
<script>
(async () => {
  const page = await (await fetch('../index.html', { cache: 'no-store' })).text();
  // styly přání (před vlastní, aby šly přebít), písma a společné přechody
  const pageStyle = document.createElement('style');
  pageStyle.textContent = page.match(/<style>([\s\S]*?)<\/style>/)[1];
  document.head.insertBefore(pageStyle, document.getElementById('ogStyle'));
  document.head.insertAdjacentHTML('beforeend', page.match(/<link rel="stylesheet"[^>]*>/)[0]);
  document.body.insertAdjacentHTML('afterbegin', page.match(/<svg class="defs"[\s\S]*?<\/svg>/)[0]);
  // kresby: úsek skriptu mezi nadpisy „Kresby“ a „Pomůcky“
  const artCode = page.match(/\/\/ ─+ Kresby[^\n]*\n([\s\S]*?)\/\/ ─+ Pomůcky/)[1];
  const art = new Function(artCode + '; return { pkg: pkgSVG(), dog: dogSit(true) };')();
  document.getElementById('og').innerHTML =
    '<p class="kicker">Celní kontrola · zásilka č. 37</p>'
    + '<div class="customs">'
    + '<div class="customs__pkg">' + art.pkg + '</div>'
    + '<div class="customs__dog dog" data-mood="idle">' + art.dog + '</div>'
    + '<div class="customs__stamp"><div class="stamp"><b>Zadrženo</b><span>celní správou</span><small>č. j. 37 / TOM</small></div></div>'
    + '</div>'
    + '<h1>Zásilka pro Tomáše byla zadržena.</h1>'
    + '<p class="sub">K propuštění je nutné uhádnout tajné slovo.</p>';
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  document.title = 'hotovo';
})();
</script>
</body>
</html>
